<!doctype html>
<html>
  <head><title>ChatGPT Semantic Code Source</title></head>
  <body>
    <div data-turn-key="sanitized-code-turn-1" data-talvt-turn-state="complete">
      <div><h4 data-conversation-role="user">You said:</h4><div data-user-message-bubble>Show a sample.</div></div>
      <div><h4 data-conversation-role="assistant">ChatGPT said:</h4>
        <div data-markdown-text-style="assistant-message">
          <p>Python</p><p>普通段落中的代码。</p>
          <div data-code-block="true" data-markdown-copy="code-block">
            <div class="ActionBar-KWWAct" data-markdown-copy="exclude"><div>JavaScript</div><button>Copy code</button></div>
            <div class="Source-kILllF whitespace-pre chatgpt-code-scrollport" data-code-block-source="true"><code><span>const </span><span>x = 1;</span>
console.log(x);</code></div>
          </div>
        </div>
      </div>
    </div>
    <div data-turn-key="sanitized-code-turn-2" data-talvt-turn-state="complete">
      <div><h4 data-conversation-role="user">You said:</h4><div data-user-message-bubble>Show another sample.</div></div>
      <div><h4 data-conversation-role="assistant">ChatGPT said:</h4>
        <div data-markdown-text-style="assistant-message">
          <div data-code-block="true" data-markdown-copy="code-block">
            <div class="ActionBar-KWWAct" data-markdown-copy="exclude"><svg aria-hidden="true"></svg><div>代码</div><button>Copy code</button></div>
            <div class="Source-kILllF whitespace-pre chatgpt-code-scrollport" data-code-block-source="true"><code>line one
line two</code></div>
          </div>
          <div data-code-block="true"><div data-code-block-source="true"><pre><code class="language-typescript">const oldShape = true;</code></pre></div></div>
          <p><span class="katex"><span class="katex-mathml"><math><semantics><annotation encoding="application/x-tex">x^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">visual math</span></span></p>
        </div>
      </div>
    </div>
  </body>
</html>
