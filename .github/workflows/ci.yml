  coverage:
    name: Unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Bootstrap command boundary
        shell: bash
        env:
          ZENDIO_JOB_CLASS: generic-v1
          ZENDIO_JOB_TIMEOUT_MINUTES: '30'
        run: |
          set -euo pipefail
          export LC_ALL=C LANG=C
          shopt -s nocasematch
          env_count=0
          for env_name in $(compgen -e); do
            env_count=$((env_count + 1))
            (( env_count <= 4096 )) || { printf 'too many environment names\n' >&2; exit 1; }
            (( ${#env_name} <= 4096 )) || { printf 'environment name too large\n' >&2; exit 1; }
            env_value=${!env_name-}
            (( ${#env_value} <= 4096 )) || { printf 'environment value too large: %s\n' "$env_name" >&2; exit 1; }
            if [[ $env_name == NODE_OPTIONS || $env_name == HUSKY || $env_name == npm_config_* ]]; then
              printf 'forbidden bootstrap environment: %s\n' "$env_name" >&2
              exit 1
            fi
          done
          [[ $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ ]]
          [[ $GITHUB_RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]]
          [[ $GITHUB_JOB =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          [[ $ZENDIO_JOB_TIMEOUT_MINUTES =~ ^[1-9][0-9]*$ ]]
          [[ $ZENDIO_JOB_CLASS =~ ^[a-z0-9-]{1,64}$ ]]
          (( ${#GITHUB_RUN_ID} <= 20 && ${#GITHUB_RUN_ATTEMPT} <= 10 ))
          [[ $RUNNER_OS == Linux && $RUNNER_ARCH == X64 ]]
          [[ $ImageOS == ubuntu24 && $ImageVersion =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ $RUNNER_TEMP == /* && ${#RUNNER_TEMP} -le 4096 && -d $RUNNER_TEMP && ! -L $RUNNER_TEMP ]]
          IFS=' .' read -r uptime_seconds uptime_fraction _ < /proc/uptime
          [[ $uptime_seconds =~ ^[0-9]+$ && $uptime_fraction =~ ^[0-9]+$ ]]
          (( ${#uptime_seconds} <= 12 && ${#uptime_fraction} <= 32 ))
          uptime_fraction="${uptime_fraction}00"
          uptime_fraction="${uptime_fraction:0:2}"
          start_centiseconds=$((10#$uptime_seconds * 100 + 10#$uptime_fraction))
          (( start_centiseconds >= 0 ))
          case "$ZENDIO_JOB_CLASS" in
            static-preflight-v1|package-extension-v1|generic-v1|browser-v1)
              attempt_name="zendio-ci-node-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" ;;
            *) printf 'unknown job class\n' >&2; exit 1 ;;
          esac
          attempt_root="$RUNNER_TEMP/$attempt_name"
          stamp="$RUNNER_TEMP/zendio-command-start-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.receipt"
          [[ ! -e $attempt_root && ! -L $attempt_root && ! -e $stamp && ! -L $stamp ]]
          umask 077
          set -o noclobber
          printf 'zendio-ci-command-start-v1\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" \
            "$ZENDIO_JOB_CLASS" "$ZENDIO_JOB_TIMEOUT_MINUTES" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$start_centiseconds" > "$stamp"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node dependencies
        id: node
        uses: ./.github/actions/setup-node-deps
        env:
          ZENDIO_JOB_CLASS: generic-v1
          ZENDIO_JOB_TIMEOUT_MINUTES: '30'
      - name: Run unit tests with coverage thresholds
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.node.outputs.npm-userconfig }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node.outputs.npm-globalconfig }}
        run: node scripts/run-bounded-command.mjs --profile vitest-v1 -- run --config vitest.unit.config.ts --coverage

      - name: Print coverage summary
        env:
          NPM_CONFIG_USERCONFIG: ${{ steps.node.outputs.npm-userconfig }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node.outputs.npm-globalconfig }}
        run: node scripts/run-bounded-command.mjs --profile coverage-summary-v1

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error

      - name: Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const body = [
              '## Coverage Summary',
              '',
              `- Lines: ${summary.lines.pct}%`,
              `- Statements: ${summary.statements.pct}%`,
              `- Functions: ${summary.functions.pct}%`,
              `- Branches: ${summary.branches.pct}%`
            ].join('\n');
            const marker = '<!-- zendio-coverage-summary -->';
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: fullBody
              });
            }

